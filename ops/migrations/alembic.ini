[alembic]
script_location = .
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is deliberately absent here: env.py reads ANCHOR_DATABASE_URL
# from the environment, so the same config works unmodified in compose, CI,
# and a bare `alembic` invocation against any target.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
