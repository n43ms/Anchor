[project]
name = "anchor-runtime"
version = "1.5.0"
description = "A durable execution runtime for AI agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "redis>=5.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # anchor/chaos/harness.py (phase 8, D-36) drives the system exclusively
    # through the public HTTP API, both for the CI bounded-smoke run and
    # for the scheduled sustained run against the deployed instance — the
    # latter is a real network call, so this must be a runtime dependency,
    # not only the test-time one fastapi.testclient.TestClient already
    # required. Promoted from [dependency-groups].dev rather than added
    # fresh: no new package enters the lockfile's dependency graph, only
    # which install profile includes it.
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
]

# No dependency outside this set without maintainer approval (research.md D-04).
# Every addition is a constitution-governed decision, not a routine `uv add`.

[project.scripts]
anchor = "anchor.cli:main"
anchor-runtime = "anchor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "demo-site",
    "tests",
    ".pytest_cache",
    ".mypy_cache",
    "*.log"
]

[tool.hatch.build.targets.wheel]
packages = ["anchor"]
exclude = [
    "demo-site",
    "tests"
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["ops/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "C4", "RUF",
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["anchor", "tests"]
# ops/migrations/ is excluded: Alembic's generated revision modules and the
# SQLAlchemy Core constructs used only for migration bookkeeping are not
# type-checked to the same standard as runtime code, which never imports
# sqlalchemy (see tests/boundary/test_sqlalchemy_confined.py).
exclude = ["ops/migrations/"]

[[tool.mypy.overrides]]
module = "anchor.chaos.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# asyncpg ships without a py.typed marker recognized by this mypy version;
# its public API (Pool, Connection, exceptions) is stable enough that
# ignoring missing stubs is the pragmatic choice over vendoring our own.
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "unit: pure-function tests with no I/O",
    "property: hypothesis-based property tests",
    "replay: replay-determinism tests against fixture logs",
    "concurrency: multi-worker contention tests requiring real Postgres",
    "failure: deliberate failure-injection tests, one per §9 matrix row",
    "boundary: deployment-mode and module-boundary assertions",
    "contract: request/response shape tests against contracts/openapi.yaml",
]
